# Staging vhost only (/etc/nginx/sites-available/atlas-staging, inside the 443 server,
# before "location /"). Never in a production vhost. The sidecar checks the Open WebUI
# session itself; nginx keeps the staging Basic auth of the server block.
location ^~ /api/atlas/quality/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8241;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
}
